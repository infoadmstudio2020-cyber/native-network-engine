
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean --stacktrace

      - name: Run Unit Tests
        run: ./gradlew :native-network-engine:testDebugUnitTest --stacktrace

      - name: Build Release AAR
        run: ./gradlew :native-network-engine:assembleRelease --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Build Outputs
        run: |
          echo "=== AAR ==="
          find native-network-engine/build/outputs/aar -type f -name "*.aar"

          echo "=== APK ==="
          find app/build/outputs/apk -type f -name "*.apk"

          test -n "$(find native-network-engine/build/outputs/aar -name '*.aar' -print -quit)"
          test -n "$(find app/build/outputs/apk -name '*.apk' -print -quit)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            native-network-engine/build/outputs/aar/*.aar
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
