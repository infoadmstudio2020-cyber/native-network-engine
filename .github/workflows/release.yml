
name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAR
        run: ./gradlew clean :native-network-engine:assembleRelease --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Release Artifacts
        run: |
          echo "Checking generated release files..."

          find native-network-engine/build/outputs/aar -name "*.aar"
          find app/build/outputs/apk/release -name "*.apk"

          test -n "$(find native-network-engine/build/outputs/aar -name '*.aar' -print -quit)"
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            native-network-engine/build/outputs/aar/*.aar
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
