jdk:
  - openjdk17
before_install:
  - git config --global --add safe.directory '*' || true
  - chmod +x gradlew
install:
  - ./gradlew clean :native-network-engine:assembleRelease :native-network-engine:publishToMavenLocal :app:assembleRelease --stacktrace || ./gradlew clean :native-network-engine:assembleRelease :native-network-engine:publishToMavenLocal --stacktrace
